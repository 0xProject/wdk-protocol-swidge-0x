name: publish

on:
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node 22.22.0
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.0'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm clean-install

      - name: Lint code with standard
        run: npm run lint

      - name: Run tests
        run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: npm-publish

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node 22.22.0
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.0'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm clean-install

      # types/ is gitignored, so the declarations must be generated here or the
      # published tarball would ship without the types referenced by "exports".
      - name: Build type declarations
        run: npm run build:types

      - name: Verify type declarations were emitted
        run: test -f types/index.d.ts

      - name: Publish to npm
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
